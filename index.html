 clear(G.matches);for(const b of A)if(b!==a)b.dot.setAttribute('class','target');
 let xs=A.filter(b=>b!==a&&Math.abs(b.target_x-a.target_x)<35),ys=A.filter(b=>b!==a&&Math.abs(b.target_y-a.target_y)<35);
 if(xs.length){let all=[a,...xs];line(a.target_x,Math.min(...all.map(b=>b.target_y)),a.target_x,Math.max(...all.map(b=>b.target_y)),'match-x',G.matches)}
 if(ys.length){let all=[a,...ys];line(Math.min(...all.map(b=>b.target_x)),a.target_y,Math.max(...all.map(b=>b.target_x)),a.target_y,'match-y',G.matches)}
 for(const b of A){if(b===a)continue;let x=xs.includes(b),y=ys.includes(b);if(x||y)b.dot.classList.add(x&&y?'same-both':x?'same-x':'same-y')}
 measure(a);
 info.innerHTML=`<div class="header"><div class="number">Прожектор № ${String(a.id).padStart(2,'0')}</div><div class="tag">Точка нацеливания</div></div><div class="coords"><div class="coord"><span>От левой</span><strong>${fmt(a.left_m)} м</strong></div><div class="coord"><span>От правой</span><strong>${fmt(a.right_m)} м</strong></div><div class="coord"><span>От нижней</span><strong>${fmt(a.bottom_m)} м</strong></div><div class="coord"><span>От верхней</span><strong>${fmt(a.top_m)} м</strong></div></div><div class="foot">Розовый луч — выбранный прожектор. Голубой пунктир — точки с одинаковым X; оранжевый — с одинаковым Y.</div>`;
 if(matchMedia('(max-width:700px)').matches)document.getElementById('panel').scrollTop=0;
}
for(const a of A){const beam=el('g',{class:'beam'},G.beams);line(a.source_x,a.source_y,a.target_x,a.target_y,'beam-line',beam);line(a.source_x,a.source_y,a.target_x,a.target_y,'beam-hit',beam);beam.addEventListener('click',()=>show(a));a.beam=beam;
 circ(a.source_x,a.source_y,450,'source',G.sources);const sh=circ(a.source_x,a.source_y,1800,'source-hit',G.sources);sh.addEventListener('click',()=>show(a));
 a.dot=circ(a.target_x,a.target_y,590,'target',G.targets);const th=circ(a.target_x,a.target_y,2100,'target-hit',G.targets);th.addEventListener('click',()=>show(a));
 const group=el('g',{transform:`translate(${a.source_x},${a.source_y}) scale(1,-1)`},G.labels);const tx=el('text',{x:a.source_x<0?-1350:1350,y:500,class:'num','text-anchor':a.source_x<0?'end':'start'},group);tx.textContent=a.id;
}
// Zoom around the viewport center; pointer drag and two-finger pinch work offline.
const base={x:-64000,y:-82000,w:128000,h:164000};let view={...base},pointers=new Map(),dragging=false;
function vb(){S.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`)}
function zoom(f,cx=view.x+view.w/2,cy=view.y+view.h/2){let nw=Math.min(base.w*2,Math.max(base.w/12,view.w/f)),nh=nw*base.h/base.w;let rx=(cx-view.x)/view.w,ry=(cy-view.y)/view.h;view={x:cx-rx*nw,y:cy-ry*nh,w:nw,h:nh};vb()}
document.getElementById('plus').onclick=()=>zoom(1.6);document.getElementById('minus').onclick=()=>zoom(1/1.6);document.getElementById('reset').onclick=()=>{view={...base};vb()};
S.addEventListener('wheel',e=>{e.preventDefault();let r=S.getBoundingClientRect(),cx=view.x+(e.clientX-r.left)/r.width*view.w,cy=view.y+(e.clientY-r.top)/r.height*view.h;zoom(e.deltaY<0?1.25:.8,cx,cy)},{passive:false});
S.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});dragging=false;if(e.target===S)S.setPointerCapture(e.pointerId)});
S.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=pointers.get(e.pointerId),dx=e.clientX-old.x,dy=e.clientY-old.y;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});let r=S.getBoundingClientRect();if(Math.abs(dx)+Math.abs(dy)>2)dragging=true;
 if(pointers.size===1){view.x-=dx/r.width*view.w;view.y-=dy/r.height*view.h;vb()}
 else if(pointers.size===2){let now=[...pointers.values()], other=now.find(p=>p!==pointers.get(e.pointerId));let prevdist=Math.hypot(old.x-other.x,old.y-other.y),dist=Math.hypot(e.clientX-other.x,e.clientY-other.y);if(prevdist>10&&dist>10)zoom(dist/prevdist)}
});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])S.addEventListener(ev,e=>pointers.delete(e.pointerId));
